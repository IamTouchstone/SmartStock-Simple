<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="ai-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="ai-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="ai-grad-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="ai-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Container Background -->
  <rect width="512" height="512" rx="112" fill="url(#ai-bg)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Iconic Symbol Center -->
  <g transform="translate(106, 80) scale(3)">
    <path d="M50 14 L80 31 L50 48 L20 31 Z" fill="url(#ai-grad-primary)" opacity="0.95" />
    <path d="M20 31 L50 48 V82 L20 65 Z" fill="url(#ai-grad-primary)" opacity="0.75" />
    <path d="M50 48 L80 31 V52 L50 69 Z" fill="url(#ai-grad-primary)" opacity="0.85" />
    <path d="M50 69 L80 52 V68 L50 85 Z" fill="url(#ai-grad-gold)" filter="url(#ai-glow)" />
    <circle cx="50" cy="48" r="5" fill="#FFFFFF" />
  </g>
</svg>