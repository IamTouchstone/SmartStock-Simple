<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="ss-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="ss-grad-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="ss-grad-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="ss-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Isometric Cube Backing -->
  <path d="M50 12 L84 31.5 V70.5 L50 90 L16 70.5 V31.5 Z" fill="url(#ss-grad-glow)" opacity="0.15" />
  
  <!-- Interlocking Smart S-Shape & Upward Growth Arrow -->
  <!-- Top Face / Layer -->
  <path d="M50 14 L80 31 L50 48 L20 31 Z" fill="url(#ss-grad-primary)" opacity="0.95" />
  
  <!-- Left Column Wall -->
  <path d="M20 31 L50 48 V82 L20 65 Z" fill="url(#ss-grad-primary)" opacity="0.75" />
  
  <!-- Right Arrow Surge Side -->
  <path d="M50 48 L80 31 V52 L50 69 Z" fill="url(#ss-grad-primary)" opacity="0.85" />
  <path d="M50 69 L80 52 V68 L50 85 Z" fill="url(#ss-grad-gold)" filter="url(#ss-glow)" />

  <!-- Center AI Spark Overlay -->
  <circle cx="50" cy="48" r="5" fill="#FFFFFF" filter="url(#ss-glow)" />
  <path d="M50 38 V43 M50 53 V58 M40 48 H45 M55 48 H60" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
</svg>